[package]
name = "remon-server"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base32 = "0.5.0"
base64 = "0.22.1"
chrono = "0.4.38"
dotenv = "0.15.0"
fast_qr = "0.13.1"
axum = "0.8.8"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "compression-gzip"] }
jsonwebtoken = { version = "9.3.0" }
reqwest = "0.12"
ring = "0.17.14"
serde = { version = "1.0.202", features = ["derive"] }
serde_derive = "1.0.202"
serde_json = "1.0.117"
thiserror = "1.0.61"
sqlx = { version = "0.7.4", features = ["sqlite", "runtime-tokio"] }
sysinfo = "0.30.12"
totp-rs = "5.5.1"
env_logger = "0.11.3"
log = "0.4.21"
local-ip-address = "0.6.1"
blake3 = "1.5.1"
maplit = "1.0.2"
lazy_static = "1.4.0"
async_once = "0.2.6"
fcm = { git = "https://github.com/rj76/fcm-rust.git" , rev = "cd7323ce" }
strum = "0.26.2"
strum_macros = "0.26.2"
tokio = { version = "1.37.0", features = ["full"] }
tonic = "0.11.0"
tonic-reflection = "0.11.0"
prost = "0.12.6"
colored = "2.1.0"
tracing-core = "0.1.36"

[build-dependencies]
tonic-build = "0.11.0"

[dev-dependencies]
ctor = "0.2.8"
