[package]
name = "remon-server"
version = "0.8.2"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
config = "0.15"
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.10", features = ["trace", "compression-gzip", "compression-br", "compression-zstd", "cors", "limit", "timeout"] }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "form",
] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
cron = "0.16"
thiserror = "2"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate"] }
sysinfo = { version = "0.39.3" }
log = "0.4"
blake3 = "1.8"
tokio = { version = "1.52", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "signal",
    "net",
    "fs",
    "io-util",
    "process",
] }
tokio-stream = { version = "0.1.18", features = ["sync", "io-util"] }
colored = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "tracing-log"] }
bollard = { version = "0.21", optional = true, default-features = false, features = ["pipe"] }
futures-util = "0.3"
argon2 = "0.5"
rand = "0.10"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
uuid = { version = "1.0", features = ["v4"] }
subtle = "2"
tower_governor = "0.8"
shell-words = "1"
libc = "0.2"

[features]
default = ["docker"]
docker = ["dep:bollard"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[dev-dependencies]
ctor = "1.0"
