# Default configuration for remon-server.
# Override per-environment in config/development.toml or config/production.toml,
# or at runtime via REMON__<SECTION>__<KEY> environment variables.
# Set RUN_ENV=production to load config/production.toml on top of this file.

[server]
port = 8080
host = "0.0.0.0"
# Set true only when behind a reverse proxy that sets X-Forwarded-For.
# Leaving false while behind a proxy is safe but collapses all clients to
# the proxy IP. Setting true while exposed directly allows header spoofing.
trusted_proxy = false

[database]
path = "./db/monitor.sqlite3"
folder_path = "./db"
max_connections = 5

[auth]
# Optional. Left at this placeholder, the server generates a strong secret on
# first boot and persists it (server_secrets table). Set an explicit value
# (>=32 chars) only to share or rotate it across instances.
# Env: REMON__AUTH__JWT_SECRET
jwt_secret = "d3f4ult"
access_token_ttl_secs = 3600    # 1 hour
refresh_token_ttl_secs = 2592000 # 30 days
pairing_code_ttl_secs = 300     # 5 minutes

[monitoring]
log_insertion_level = "warn" # error | warn | info | debug | trace
app_name = "remon"

[logging]
level = "info"   # error | warn | info | debug | trace
format = "compact" # compact | pretty | json

[notifications.fcm]
# Env: REMON__NOTIFICATIONS__FCM__SERVICE_ACCOUNT_PATH
service_account_path = ""

[notifications.telegram]
# Env: REMON__NOTIFICATIONS__TELEGRAM__BOT_TOKEN
bot_token = ""

[notifications.ntfy]
# Env: REMON__NOTIFICATIONS__NTFY__TOKEN
# token = ""

[notifications.webhook]
# Env: REMON__NOTIFICATIONS__WEBHOOK__SECRET
# secret = ""
# SSRF guard: rejects private/loopback targets by default.
# allow_private_targets = true  — lifts the check entirely (dev/homelab only).
# allowed_private_hosts = ["mattermost.internal"]  — per-host exceptions.
allow_private_targets = false
# allowed_private_hosts = []

[cors]
# Set false in production and list allowed origins below.
# Env: REMON__CORS__ALLOW_ANY_ORIGIN
allow_any_origin = false
# allowed_origins = ["https://app.example.com"]
allowed_origins = []

[docker]
# Leave empty for platform default (Docker or Podman socket).
# Env: REMON__DOCKER__SOCKET_PATH
socket_path = ""
# Keep false in production — any valid token can exec into privileged containers.
# Env: REMON__DOCKER__EXEC_ENABLED
exec_enabled = false

[smart]
# SMART disk health via smartctl (smartmontools). When the binary is
# missing the collector logs once and turns itself off — no other cost.
# Env: REMON__SMART__ENABLED
enabled = true
# Explicit binary path; empty = resolve "smartctl" from PATH.
# Env: REMON__SMART__SMARTCTL_PATH
smartctl_path = ""
# Poll interval is runtime config: PATCH /config { collector_smart_interval_ms }
# (default 30 min, floor 60 s). See CONFIG.md.

[assistant]
# Read-only operator assistant. Answers plain-language questions ("why is my
# server slow?") by calling read-only tools over this host's own telemetry.
# Provider-abstracted over any OpenAI-compatible chat endpoint; the api_key
# stays server-side and never reaches a client.
#
# Off until an api_key is set. Defaults target Google AI Studio's free tier:
# create a key at aistudio.google.com and set REMON__ASSISTANT__API_KEY.
# Env: REMON__ASSISTANT__ENABLED
enabled = true
# OpenAI-compatible base URL; "/chat/completions" is appended.
# Gemini:     https://generativelanguage.googleapis.com/v1beta/openai
# Groq:       https://api.groq.com/openai/v1
# Ollama:     http://localhost:11434/v1
# OpenRouter: https://openrouter.ai/api/v1   (reaches Claude/GPT/etc. via one key)
# Anthropic:  https://api.anthropic.com/v1   (auto-switches to the native
#             Messages API with prompt caching; model = "claude-haiku-4-5")
# Env: REMON__ASSISTANT__BASE_URL
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# Env: REMON__ASSISTANT__API_KEY
api_key = ""
# Model id. gemini-2.5-flash is fast and free-tier; for deeper diagnosis use a
# stronger reasoner on the same endpoint (model = "gemini-2.5-pro") or point
# base_url at OpenRouter and set e.g. "anthropic/claude-opus-4-8".
# Env: REMON__ASSISTANT__MODEL
model = "gemini-2.5-flash"
# Response token ceiling per model turn.
# Env: REMON__ASSISTANT__MAX_TOKENS
max_tokens = 2048
# Optional Prometheus server for the prometheus_query tool. Empty hides it.
# Env: REMON__ASSISTANT__PROMETHEUS_URL
prometheus_url = ""
# Dev mode: allow per-ask overrides (system prompt, step/token limits,
# bare-model chat, loop trace) from authenticated clients — for developing
# the assistant itself. Requests carrying overrides are rejected while this
# is off. Keep off in normal operation.
# Env: REMON__ASSISTANT__DEV
dev = false
# Continuous process sampling for list_processes time context (15-minute
# per-process avg/max). One full process refresh per tick; disable on hosts
# with very large process tables.
# Env: REMON__ASSISTANT__PROCESS_HISTORY
process_history = true
# Persistent name-grouped process series: every minute the top-K process
# groups by cpu and by memory (union) land in metrics_process, enabling
# process.cpu_percent{name="..."} alert rules and history queries. Bounded
# by K, never by the host's process count. 0 disables; needs process_history.
# Env: REMON__ASSISTANT__PROCESS_SERIES_TOP_K
process_series_top_k = 20
