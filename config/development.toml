# Development environment configuration
# Overrides default.toml settings for local development

[server]
port = 8080

[logging]
level = "debug"

[cors]
# Local web UI usually runs on a different port (Vite=5173, CRA=3000) than
# the API (8080), so the browser sees a cross-origin call. Allow any origin
# in dev to keep the workflow friction-free.
allow_any_origin = true
