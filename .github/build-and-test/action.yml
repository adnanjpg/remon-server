name: "Build and test app"
description: "Build and test app on different platforms"
on:
  push:
    branches:
      - main

jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: ⚡ Cache
        uses: actions/cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build and test
        run: |
          # Commands to build and test the app

  build_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        os: [windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: ⚡ Cache
        uses: actions/cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: choco install protoc

      - name: Build and test
        run: |
          # Commands to build and test the app

  build_macos:
    runs-on: macOS-latest
    strategy:
      matrix:
        os: [macOS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: ⚡ Cache
        uses: actions/cache@v2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: brew install protobuf

      - name: Build and test
        run: |
          # Commands to build and test the app
