name: Build aarch64 Linux Binary

on:
  workflow_dispatch:  # Manuel tetikleme
  # İstersen aşağıdakileri de etkinleştirebilirsin:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-gnu

    - name: Install cross-compilation dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          protobuf-compiler \
          libssl-dev \
          pkg-config

    - name: Setup Cargo config for cross-compilation
      run: |
        mkdir -p .cargo
        cat > .cargo/config.toml << 'EOF'
        [target.aarch64-unknown-linux-gnu]
        linker = "aarch64-linux-gnu-gcc"
        EOF

    - name: Build for aarch64
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        PKG_CONFIG_ALLOW_CROSS: 1
      run: cargo build --release --target aarch64-unknown-linux-gnu

    - name: List build artifacts
      run: |
        ls -lah target/aarch64-unknown-linux-gnu/release/
        file target/aarch64-unknown-linux-gnu/release/remon-server

    - name: Package binary
      run: |
        mkdir -p dist
        cp target/aarch64-unknown-linux-gnu/release/remon-server dist/
        tar -czvf remon-server-aarch64-linux-gnu.tar.gz -C dist .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: remon-server-aarch64-linux-gnu
        path: ./remon-server-aarch64-linux-gnu.tar.gz
        retention-days: 30

    - name: Upload binary only
      uses: actions/upload-artifact@v4
      with:
        name: remon-server-aarch64-binary
        path: target/aarch64-unknown-linux-gnu/release/remon-server
        retention-days: 30
