name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: ⚡ Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: 🔨 Build
      env:
        REMON__AUTH__JWT_SECRET: "ci-test-secret-minimum-32-characters-long-12345678"
      run: cargo build --release --all-features --target ${{ matrix.target }}

    - name: Package binary
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/remon-server dist/
        tar -czvf ${{ matrix.platform }}-${{ matrix.target }}-release.tar.gz -C dist .

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.platform }}-${{ matrix.target }}-release.tar.gz
